name: Build Android Code Studio
# Mini: workflow aktif untuk push ke main + lite/** (repo galaxya06hype-creator/Android-Code-Studio-Mini).

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
      - "lite/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build_release_apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Determine Build Type Configuration
        run: |
          SELECTED_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_TYPE="${SELECTED_TYPE:-Debug}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generating missing dirs (termasuk varian flavor lite/full)
        run: |
          BASE="$GITHUB_WORKSPACE/core/app/build/intermediates"
          for V in liteDebug liteRelease fullDebug fullRelease debug release; do
            C="$(echo "${V:0:1}" | tr '[:lower:]' '[:upper:]')${V:1}"
            mkdir -p "$BASE/external_file_lib_dex_archives/$V/desugar${C}FileDependencies"
            mkdir -p "$BASE/l8_art_profile/$V/l8DexDesugarLib${C}"
          done

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Check release secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.SIGNING_STORE_PASSWORD }}" ] && [ -n "${{ secrets.SIGNING_KEY_PASSWORD }}" ]; then
            echo "has_release=true" >> $GITHUB_OUTPUT
          else
            echo "has_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache Android NDK 27.1.12297006
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/27.1.12297006
          key: ${{ runner.os }}-ndk-27.1.12297006-v1

      - name: Install NDK 27.1.12297006 + accept licenses
        run: |
          ls "$ANDROID_HOME/ndk/" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" "platforms;android-34" "build-tools;35.0.0"

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Ensure debug keystore (fallback bila tanpa secrets)
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create local.properties (hanya bila secrets ada)
        if: steps.secrets.outputs.has_release == 'true'
        run: |
          echo "signing.storeFile=signing/signing-key.jks" >> local.properties
          echo "signing.storePassword=${{ secrets.SIGNING_STORE_PASSWORD }}" >> local.properties
          echo "signing.keyAlias=androidcs" >> local.properties
          echo "signing.keyPassword=${{ secrets.SIGNING_KEY_PASSWORD }}" >> local.properties

      - name: Assemble Lite Debug (wajib hijau)
        run: ./gradlew :core:app:assembleLiteDebug

      - name: Assemble Lite Release (best-effort, debug-signed bila tanpa secrets)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :core:app:assembleLiteRelease

      - name: List APK files
        run: ls -la core/app/build/outputs/apk/lite/debug/ core/app/build/outputs/apk/lite/release/ || true

      - name: Upload Debug arm64-v8a APK (wajib ada)
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-debug
          path: core/app/build/outputs/apk/lite/debug/*arm64-v8a*.apk
        if: always()

      - name: Upload Release arm64-v8a APK (opsional)
        uses: actions/upload-artifact@v4
        with:
          name: apk-arm64-v8a-release
          path: core/app/build/outputs/apk/lite/release/*arm64-v8a*.apk
          if-no-files-found: warn
        if: always()
